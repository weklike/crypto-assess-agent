# 测试专用：与正式 scoring.v2.yaml 相同，另外把 fixtures 仿标准的条款映射到测评单元
# 量化评分规则 v2：按《商用密码应用安全性评估量化评估规则（2023 版）》
# （中国密码学会密评联委会，2023-07-17 发布，2023-08-01 实施）第 5 章与表 1–4 转录。
#
# 计算过程（全部来自原文）：
#   1. 技术测评对象：按 D（密码使用有效性）/ A（密码算法/技术合规性）/ K（密钥管理安全）独立判定，
#      D、A、K 都满足 = 1；D 满足、A 不满足 = 0.5·Ra；D 满足、K 不满足 = 0.5·Rk；D 满足、A、K 都不满足 = 0.25·Ra·Rk；
#      D 不满足 = 0。四舍五入到 4 位。
#   2. 技术测评单元 = 单元内所有测评对象得分的算术平均（4 位）；管理测评单元按判定：符合 1、部分符合 0.5、不符合 0。
#   3. 安全层面 = 适用测评单元按单元权重（随等级变化，表 4）的加权平均（4 位）；“/”表示该等级不评价。
#   4. 总分 S = 技术四层面加权平均 × 70 + 管理四层面加权平均 × 30（2 位）；某层面全部不适用则不参与。
#   5. 本项目约定：技术组或管理组整组不适用时（公式分母为 0），不出总分，转人工（decisions.md）。
# 条款到测评单元的映射：units[].clause_refs 为显式映射；未列出时按条款标题与 name / titles 完全一致匹配（同一层面内）。
# 通用要求与各层面的“密码服务”“密码产品”指标不单独评价（unscored_titles）。
# 修改数值时新建 scoring.v3.yaml，旧报告按其记录的 rule_version 复现。
format: official-2023
version: v2-test
# 表 4 的逐项数值需仓库所有者对照原文核对，核对后改为 true
reviewed: false
scale: 100
rounding: {intermediate_scale: 4, total_scale: 2, mode: HALF_UP}
not_applicable: 不适用
management_scores: {符合: 1, 部分符合: 0.5, 不符合: 0}
# 表 2：按所用密码算法/技术的安全强度取 Ra（从高到低匹配）
ra:
  - {min_bits: 112, value: 1}
  - {min_bits: 80, value: 0.5}
  - {min_bits: 0, value: 0.2}
# 表 3：密钥管理安全修正参数 Rk；满足 module_level 且符合 GM/T 0115—2021“5.5 密钥管理安全性”其他要求时取 value，否则取 default
rk:
  "1": {default: 1}
  "2": {default: 1}
  "3": {default: 1, module_level: 1, value: 1.2}
  "4": {default: 1, module_level: 2, value: 1.5}
unscored_titles: [密码服务, 密码产品]
# 仿标准的“通用要求”（4.1、4.2）按原文不单独评价
unscored_clause_refs: ["FIX/T 0001-2026#4.1", "FIX/T 0001-2026#4.2"]
groups:
  - {name: 密码应用技术要求, weight: 70, scoring: dak, layers: [物理和环境, 网络和通信, 设备和计算, 应用和数据]}
  - {name: 密码应用管理要求, weight: 30, scoring: judgment, layers: [管理制度, 人员管理, 建设运行, 应急处置]}
layers: {物理和环境: 10, 网络和通信: 20, 设备和计算: 10, 应用和数据: 30, 管理制度: 8, 人员管理: 8, 建设运行: 8, 应急处置: 6}
# 表 4：测评单元权重；weights 中缺少的等级即原表中的“/”
units:
  - {layer: 物理和环境, name: 身份鉴别, weights: {1: 0.4, 2: 0.7, 3: 1, 4: 1}, clause_refs: ["FIX/T 0001-2026#5.1.1"]}
  - {layer: 物理和环境, name: 电子门禁记录数据存储完整性, weights: {1: 0.4, 2: 0.4, 3: 0.7, 4: 0.7}, clause_refs: ["FIX/T 0001-2026#5.1.2"]}
  - {layer: 物理和环境, name: 视频记录数据存储完整性, titles: [视频监控记录数据存储完整性], weights: {3: 0.7, 4: 0.7}, clause_refs: ["FIX/T 0001-2026#5.1.3"]}
  - {layer: 网络和通信, name: 身份鉴别, weights: {1: 0.4, 2: 0.7, 3: 1, 4: 1}, clause_refs: ["FIX/T 0001-2026#5.2.1"]}
  - {layer: 网络和通信, name: 通信数据完整性, weights: {1: 0.4, 2: 0.4, 3: 0.7, 4: 1}, clause_refs: ["FIX/T 0001-2026#5.2.2"]}
  - {layer: 网络和通信, name: 通信过程中重要数据的机密性, weights: {1: 0.4, 2: 0.7, 3: 1, 4: 1}, clause_refs: ["FIX/T 0001-2026#5.2.3"]}
  - {layer: 网络和通信, name: 网络边界访问控制信息的完整性, weights: {1: 0.4, 2: 0.4, 3: 0.4, 4: 0.7}, clause_refs: ["FIX/T 0001-2026#5.2.4"]}
  - {layer: 网络和通信, name: 安全接入认证, weights: {3: 0.4, 4: 0.7}, clause_refs: ["FIX/T 0001-2026#5.2.5"]}
  - {layer: 设备和计算, name: 身份鉴别, weights: {1: 0.4, 2: 0.7, 3: 1, 4: 1}, clause_refs: ["FIX/T 0001-2026#5.3.1"]}
  - {layer: 设备和计算, name: 远程管理通道安全, weights: {3: 1, 4: 1}, clause_refs: ["FIX/T 0001-2026#5.3.2"]}
  - {layer: 设备和计算, name: 系统资源访问控制信息完整性, weights: {1: 0.4, 2: 0.4, 3: 0.4, 4: 0.7}, clause_refs: []}
  - {layer: 设备和计算, name: 重要信息资源安全标记完整性, weights: {3: 0.4, 4: 0.7}, clause_refs: []}
  - {layer: 设备和计算, name: 日志记录完整性, weights: {1: 0.4, 2: 0.4, 3: 0.4, 4: 0.7}, clause_refs: ["FIX/T 0001-2026#5.3.3"]}
  - {layer: 设备和计算, name: 重要可执行程序完整性、重要可执行程序来源真实性, weights: {3: 0.7, 4: 1}, clause_refs: []}
  - {layer: 应用和数据, name: 身份鉴别, weights: {1: 0.4, 2: 0.7, 3: 1, 4: 1}, clause_refs: ["FIX/T 0001-2026#5.4.1"]}
  - {layer: 应用和数据, name: 访问控制信息完整性, weights: {1: 0.4, 2: 0.4, 3: 0.4, 4: 0.7}, clause_refs: []}
  - {layer: 应用和数据, name: 重要信息资源安全标记完整性, weights: {3: 0.4, 4: 0.7}, clause_refs: []}
  - {layer: 应用和数据, name: 重要数据传输机密性, weights: {1: 0.4, 2: 0.7, 3: 1, 4: 1}, clause_refs: ["FIX/T 0001-2026#5.4.2"]}
  - {layer: 应用和数据, name: 重要数据存储机密性, weights: {1: 0.4, 2: 0.7, 3: 1, 4: 1}, clause_refs: ["FIX/T 0001-2026#5.4.3"]}
  - {layer: 应用和数据, name: 重要数据传输完整性, weights: {1: 0.4, 2: 0.7, 3: 0.7, 4: 1}, clause_refs: []}
  - {layer: 应用和数据, name: 重要数据存储完整性, weights: {1: 0.4, 2: 0.7, 3: 0.7, 4: 1}, clause_refs: ["FIX/T 0001-2026#5.4.4"]}
  - {layer: 应用和数据, name: 不可否认性, weights: {3: 1, 4: 1}, clause_refs: ["FIX/T 0001-2026#5.4.5"]}
  - {layer: 管理制度, name: 具备密码应用安全管理制度, weights: {1: 1, 2: 1, 3: 1, 4: 1}, clause_refs: ["FIX/T 0001-2026#6.1.1"]}
  - {layer: 管理制度, name: 密钥管理规则, weights: {1: 0.7, 2: 0.7, 3: 0.7, 4: 0.7}, clause_refs: []}
